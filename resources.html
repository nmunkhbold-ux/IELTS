<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Resources | IELTS Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27%238f9bff%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d14;--s1:#11141e;--s2:#161a27;--line:#252b3c;--ink:#e8ebf4;--muted:#9aa3b8;--dim:#6f7891;
  --w:#8f9bff;--r:#3fdca0;--sp:#ffb35c;--m:#4fd1e8;--n:#7cc4ff;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;
  background:radial-gradient(1000px 520px at 15% -160px, rgba(143,155,255,.22), transparent 70%), radial-gradient(800px 480px at 100% -100px, rgba(79,209,232,.16), transparent 70%), radial-gradient(700px 400px at 60% 105%, rgba(63,220,160,.08), transparent 70%), var(--bg);background-attachment:fixed;min-height:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--w);outline-offset:3px;border-radius:6px}
.st-top{position:sticky;top:0;z-index:40;backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);background:rgba(11,13,20,.72);border-bottom:1px solid rgba(255,255,255,.06)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:rgba(11,13,20,.92)}
.st-top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.st-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:600;letter-spacing:-.01em;font-size:17px;white-space:nowrap}
.st-brand b{font-weight:700;background:linear-gradient(90deg,#8f9bff,#4fd1e8,#ffb35c);-webkit-background-clip:text;background-clip:text;color:transparent}
.st-mark{width:30px;height:30px;flex:none}
.st-nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.st-nav a{color:#aeb5c8;text-decoration:none;font-size:15px;padding:7px 12px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.st-nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.st-nav a[aria-current="page"]{color:#0b0d14;background:#e8ebf4}
@media (max-width:640px){.st-brand span{display:none}.st-nav a{padding:7px 10px;font-size:14px}}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
h1,h2,h3{color:#fff;letter-spacing:-.02em;margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grad{background:linear-gradient(90deg,#b9c1ff,#a6ecf6 45%,#ffd29c);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.k-Writing{color:var(--w);border-color:rgba(143,155,255,.35);background:rgba(143,155,255,.10)}
.k-Reading{color:var(--r);border-color:rgba(63,220,160,.35);background:rgba(63,220,160,.10)}
.k-Speaking{color:var(--sp);border-color:rgba(255,179,92,.35);background:rgba(255,179,92,.10)}
.k-Mixed{color:var(--m);border-color:rgba(79,209,232,.35);background:rgba(79,209,232,.10)}
.k-Notes{color:var(--n);border-color:rgba(124,196,255,.35);background:rgba(124,196,255,.10)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;text-decoration:none;background:#e8ebf4;color:#0b0d14;transition:transform .15s, box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px -12px rgba(143,155,255,.7)}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line)}
.btn.ghost:hover{border-color:#3a4260;box-shadow:none}
footer{border-top:1px solid rgba(255,255,255,.06);margin-top:80px;padding:28px 0 40px;color:var(--dim);font-size:14px}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--muted);text-decoration:none}footer a:hover{color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
<style>
.top{padding:56px 0 24px}
.top h1{font-size:clamp(34px,5vw,52px);margin:10px 0 12px}
.top p{color:#aab2c6;font-size:18px;max-width:60ch;margin:0 0 22px}
.search{display:flex;gap:10px;align-items:center;max-width:560px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--s1);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:16px;padding:8px 0;outline:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
.filters button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.filters button[aria-pressed="true"]{background:#e8ebf4;color:#0b0d14;border-color:#e8ebf4}
.grp{margin-top:44px}
.grp h2{font-size:24px;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.grp h2 i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.grp > p{color:var(--muted);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.r{padding:18px;display:flex;gap:14px;text-decoration:none;align-items:flex-start;transition:transform .2s,border-color .2s}
.r:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--c) 60%, #252b3c)}
.r .ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--c);background:color-mix(in srgb, var(--c) 15%, transparent)}
.r b{display:block;color:#fff;font-size:16px;margin-bottom:2px}
.r span{color:var(--muted);font-size:14px;line-height:1.45;display:block}
.r em{font-style:normal;font-size:12px;color:var(--dim);display:block;margin-top:6px}
.ext::after{content:" ↗";color:var(--dim)}
.empty{color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<header class="st-top"><div class="st-top-in"><a class="st-brand" href="index.html"><svg class="st-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="stg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f9bff"/><stop offset=".55" stop-color="#4fd1e8"/><stop offset="1" stop-color="#ffb35c"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="9" fill="url(#stg)"/><path d="M11 21.5c1.4 1.2 3 1.7 4.9 1.7 3 0 5-1.5 5-3.8 0-5-9.4-2.9-9.4-7.7 0-1.9 1.8-3.3 4.6-3.3 1.6 0 3 .4 4.2 1.3" fill="none" stroke="#0b0d14" stroke-width="2.4" stroke-linecap="round"/></svg><span>IELTS <b>Studio</b></span></a><nav class="st-nav" aria-label="Main"><a href="index.html">Home</a><a href="index.html#lessons">Lessons</a><a href="tests.html">Practice tests</a><a href="resources.html" aria-current="page">Resources</a></nav></div></header>
<main class="wrap">
  <section class="top">
    <span class="eyebrow">Resources</span>
    <h1>Everything in <span class="grad">one place</span>.</h1>
    <p>Recommended websites, notes, question banks and vocabulary from every lesson. Search, or filter by skill.</p>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search, for example: linking words, Part 2, vocabulary" aria-label="Search resources"></label>
    <div class="filters" id="filters"></div>
  </section>
  <div id="out"></div>
</main>
<footer><div class="wrap"><span>IELTS Studio · Resources</span><span><a href="index.html#lessons">Lessons</a> · <a href="tests.html">Practice tests</a></span></div></footer>
<script>
const G = [
  { id: "websites", title: "Practice websites", sub: "Free lessons and tests from other sites. Use them after your homework.", c: "var(--m)", items: [
    ["IELTS Liz", "Lessons and tips for every part of the test.", "https://ieltsliz.com/", "All skills", "L"],
    ["IELTS Training Online", "Practice tests for all four skills.", "https://ieltstrainingonline.com/", "All skills", "T"],
    ["IELTS-up", "Reading practice passages with answers.", "https://ielts-up.com/reading/ielts-reading-practice.html", "Reading", "U"],
    ["Engnovate", "Full Reading tests with answers.", "https://engnovate.com/ielts-reading-tests/", "Reading", "E"],
    ["IELTS Buddy", "Matching headings practice.", "https://www.ieltsbuddy.com/paragraph-headings.html", "Reading", "B"],
    ["IELTS Writing Info", "Writing tasks with sample answers.", "https://www.ielts-writing.info/EXAM/", "Writing", "W"]] },
  { id: "writing", title: "Writing", sub: "Notes, vocabulary and models for Task 1 and Task 2.", c: "var(--w)", items: [
    ["Writing Task 1 notes", "Criteria, structure, tenses and a full vocabulary bank.", "notes.html", "Writing", "✎"],
    ["Task 1 step by step", "Paraphrase machine, overview builder and vocabulary tabs.", "session-02.html", "Writing", "2"],
    ["Task 2 model essays", "Two complete essays with paragraph-by-paragraph labels.", "session-05.html#part-g", "Writing", "5"],
    ["Task 2 practice questions", "Four essay questions with a 40-minute timer and checklist.", "session-05.html#part-h", "Writing", "5"],
    ["Paraphrasing vocabulary bank", "33 safe paraphrase pairs, searchable.", "session-07.html#part-d", "Writing", "7"],
    ["Paraphrasing workshop", "40 sentences with three model answers each.", "session-07.html#part-f", "Writing", "7"]] },
  { id: "reading", title: "Reading", sub: "Question types, strategies and full tests.", c: "var(--r)", items: [
    ["Reading notes", "Every question type, with tips and traps.", "reading-notes.html", "Reading", "❑"],
    ["True / False / Not Given method", "The three answers explained, with a warm-up.", "session-01.html#part-m", "Reading", "1"],
    ["Skimming and scanning", "Main ideas, topic sentences and summaries.", "session-03.html#part-a", "Reading", "3"],
    ["Practice tests", "Five full computer-format Reading tests.", "tests.html", "Reading", "⏱"]] },
  { id: "speaking", title: "Speaking", sub: "Question banks, phrases and timed practice for all three parts.", c: "var(--sp)", items: [
    ["Part 1 question bank", "382 questions in 51 topics, searchable.", "session-04.html#part-i", "Speaking", "1"],
    ["Linking words", "Ten functions with examples and quizzes.", "session-04.html#part-f", "Speaking", "4"],
    ["Useful speaking phrases", "Phrases for starting, fixing mistakes and finishing.", "session-04.html#part-g", "Speaking", "4"],
    ["Part 2 topic cards", "22 cards with real timing and recording.", "session-08.html#part-f", "Speaking", "2"],
    ["Part 2 dice game", "Roll three dice for a random topic card.", "session-08.html#part-f", "Speaking", "⚄"],
    ["Part 3 question practice", "Questions by type, with a timer and recording.", "session-09.html#part-g", "Speaking", "3"],
    ["Topic collocations", "Education, technology, environment, society and work.", "session-09.html#part-f", "Speaking", "✦"]] }];
const F = ["All", "Writing", "Reading", "Speaking", "Websites"];
let filter = "All";
document.getElementById("filters").innerHTML = F.map(f => `<button data-f="${f}" aria-pressed="${f === filter}">${f}</button>`).join("");
document.querySelectorAll("#filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll("#filters button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
function draw() {
  const q = document.getElementById("q").value.toLowerCase().trim();
  const html = G.filter(g => filter === "All" || (filter === "Websites" ? g.id === "websites" : g.id === filter.toLowerCase() || (g.id === "websites" && false))).map(g => {
    const its = g.items.filter(([t, d, , s]) => !q || (t + " " + d + " " + s).toLowerCase().includes(q));
    if (!its.length) return "";
    return `<section class="grp" id="${g.id}" style="--c:${g.c}"><h2><i></i>${g.title}</h2><p>${g.sub}</p><div class="cards">${its.map(([t, d, h, s, ic]) => { const ext = /^https?:/.test(h); return `<a class="panel r${ext ? " ext" : ""}" href="${h}"${ext ? ' target="_blank" rel="noopener"' : ""} style="--c:${g.c}"><span class="ic">${ic}</span><span><b>${t}</b><span>${d}</span><em>${ext ? new URL(h).hostname.replace(/^www\./, "") : s}</em></span></a>`; }).join("")}</div></section>`;
  }).join("");
  document.getElementById("out").innerHTML = html || '<p class="empty">Nothing found. Try another word.</p>';
}
document.getElementById("q").addEventListener("input", draw);
draw();
if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
