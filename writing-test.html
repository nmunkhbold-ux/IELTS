<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing practice tests | IELTS Studio</title>
<style>
:root{
  --bg:#ffffff; --text:#1a1a1a; --muted:#5b5b5b; --line:#d4d4d4; --bar:#f2f2ef; --bar-line:#dadad5;
  --accent:#0a3d91; --focus:#1f6fd1; --ok:#1e7a3c; --bad:#b3261e; --flag:#c25e00;
  --btn:#000; --btn-text:#fff; --btn-off:#e3e3e3; --fs:16px; color-scheme: light;
}
:root[data-contrast="wob"]{ --bg:#000; --text:#fff; --muted:#cfcfcf; --line:#555; --bar:#111; --bar-line:#444; --accent:#9cc4ff; --focus:#9cc4ff; --ok:#7bd88f; --bad:#ff8a80; --flag:#ffb74d; --btn:#fff; --btn-text:#000; --btn-off:#333; color-scheme: dark; }
:root[data-contrast="yob"]{ --bg:#000; --text:#ffe600; --muted:#e6cf00; --line:#665c00; --bar:#111; --bar-line:#555; --accent:#ffe600; --focus:#fff; --ok:#b8f5a0; --bad:#ffab91; --flag:#ffcc80; --btn:#ffe600; --btn-text:#000; --btn-off:#333; color-scheme: dark; }
:root[data-size="l"]{ --fs:19px; } :root[data-size="xl"]{ --fs:22px; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.6 Arial,"Helvetica Neue",Helvetica,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;align-items:center;gap:20px;padding:10px 20px;border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:700;font-size:26px;letter-spacing:-.5px;color:var(--accent);text-decoration:none}
.who{line-height:1.3}.who b{display:block;font-size:15px}.who span{font-size:14px;color:var(--muted)}
.grow{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:4px 10px;border-radius:4px}
.timer.warn{background:#fdecc8;color:#7a4a00}.timer.hide{visibility:hidden}
.iconbtn{background:none;border:0;padding:6px 8px;cursor:pointer;border-radius:4px;line-height:1}
.iconbtn:hover{background:var(--bar)}
.menu{position:absolute;right:16px;top:58px;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px 16px;z-index:50;width:280px;font-size:15px}
.menu[hidden]{display:none}
.menu h4{margin:10px 0 6px;font-size:15px}.menu h4:first-child{margin-top:0}
.menu label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.menu hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.menu .linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);cursor:pointer;text-decoration:underline}
.partbar{margin:14px 20px 0;background:var(--bar);border:1px solid var(--bar-line);border-radius:4px;padding:10px 16px;flex:none;line-height:1.4}
.partbar b{display:block}
.split{flex:1;display:flex;min-height:0;margin:10px 0 0;position:relative}
.pane{overflow-y:auto;padding:16px 20px 40px;min-width:0}
#taskPane{flex:0 0 50%}#writePane{flex:1;display:flex;flex-direction:column}
.divider{flex:none;width:14px;position:relative;cursor:col-resize;background:linear-gradient(var(--line),var(--line)) center/2px 100% no-repeat}
.divider button{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border:1px solid var(--text);background:var(--bg);border-radius:3px;cursor:col-resize;font-size:16px;line-height:1;padding:0}
.task{margin:0 0 .9em;max-width:70ch}
.figure{margin:18px 0 0;max-width:720px}
.figure svg{width:100%;height:auto;display:block;color:var(--text)}
.figure svg text{fill:currentColor}
textarea.ans{flex:1;min-height:240px;width:100%;resize:none;padding:12px 14px;border:1px solid var(--muted);border-radius:4px;background:var(--bg);color:var(--text);line-height:1.6}
textarea.ans[hidden]{display:none}
textarea.ans:read-only{background:var(--bar)}
.wc{margin:6px 2px 0;text-align:right;font-size:.95em;color:var(--text)}
.wc small{color:var(--muted)}
.wc.low b{color:var(--flag)}
.fnav{flex:none;display:flex;align-items:center;gap:6px;padding:0 12px}
.fnav button{width:56px;height:42px;border:0;border-radius:3px;cursor:pointer;font-size:24px;background:var(--btn);color:var(--btn-text)}
.fnav button:disabled{background:var(--btn-off);color:var(--muted);cursor:default}
.foot{flex:none;border-top:1px solid var(--line);display:flex;align-items:stretch;min-height:58px}
.parts{flex:1;display:flex;align-items:center;gap:6px 26px;padding:8px 16px;overflow-x:auto}
.pbtn{background:none;border:0;border-bottom:3px solid transparent;font-weight:700;cursor:pointer;padding:6px 4px;white-space:nowrap}
.pbtn[aria-pressed="true"]{border-bottom-color:var(--text)}
.pbtn .count{font-weight:400;color:var(--muted);margin-left:8px;font-size:.92em}
.footbtn{flex:none;width:86px;border:0;border-left:1px solid var(--line);background:var(--bar);cursor:pointer;font-size:22px}
.btn{border:1px solid var(--text);background:var(--btn);color:var(--btn-text);border-radius:4px;padding:9px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.solid{background:var(--bg)}
.modal{background:var(--bg);color:var(--text);border-radius:8px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:24px 26px;border:1px solid var(--line)}
.modal h2{margin:0 0 8px;font-size:1.3em}
.modal p{margin:0 0 10px}.modal ul{padding-left:20px;margin:6px 0 12px}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.modal input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--muted);border-radius:4px;background:var(--bg);margin:4px 0 14px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.setcard{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.setcard b{font-size:1.05em}.setcard span{color:var(--muted);font-size:.9em}
.warn-note{color:var(--bad);font-weight:700}
.ok-note{color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--btn);color:var(--btn-text);padding:10px 16px;border-radius:6px;z-index:90;font-size:15px}
.bar2{display:flex;align-items:center;gap:12px;padding:8px 20px;background:#e6f4ea;border-bottom:1px solid var(--line);font-size:15px;flex:none}
:root[data-contrast="wob"] .bar2,:root[data-contrast="yob"] .bar2{background:#0e2a15}
.bar2[hidden]{display:none}
.mobiletabs{display:none}
@media (max-width:760px){
  .who span{display:none}.brand{font-size:22px}
  .split{flex-direction:column}.divider{display:none}
  #taskPane{flex:0 0 42%}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="tests.html" title="Back to Practice tests">IELTS Studio</a>
  <div class="who"><b id="testName">Writing practice test</b><span id="whoName">60 minutes · 2 tasks</span></div>
  <div class="grow"></div>
  <span class="timer" id="timer">60:00</span>
  <button class="iconbtn" id="menuBtn" aria-label="Settings" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</header>
<div class="menu" id="menu" hidden>
  <h4>Text size</h4>
  <label><input type="radio" name="size" value="m" checked> Standard</label>
  <label><input type="radio" name="size" value="l"> Large</label>
  <label><input type="radio" name="size" value="xl"> Extra large</label>
  <h4>Colours</h4>
  <label><input type="radio" name="contrast" value="bow" checked> Black on white</label>
  <label><input type="radio" name="contrast" value="wob"> White on black</label>
  <label><input type="radio" name="contrast" value="yob"> Yellow on black</label>
  <hr>
  <label><input type="checkbox" id="hideTimer"> Hide the timer</label>
  <hr>
  <button class="linkbtn" id="restart">Restart this test</button><br>
  <a href="writing-test.html" id="otherSet">Choose a different test</a><br>
  <a href="tests.html">Back to Practice tests</a>
</div>
<div id="sentbar" class="bar2" hidden><span>✓ Submitted. Your essay is ready to send.</span><button class="btn" id="sendAgain">Send it →</button></div>
<div class="partbar" id="partbar"></div>
<main class="split" id="split">
  <section class="pane" id="taskPane" aria-label="Task"></section>
  <div class="divider" id="divider"><button aria-label="Drag to resize the panels" title="Drag to resize">&#8596;</button></div>
  <section class="pane" id="writePane" aria-label="Your answer">
    <label class="sr" for="ta1">Your answer for Part 1</label>
    <textarea class="ans" id="ta1" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Type your answer here"></textarea>
    <label class="sr" for="ta2">Your answer for Part 2</label>
    <textarea class="ans" id="ta2" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Type your answer here" hidden></textarea>
    <div class="wc" id="wc">Words: <b>0</b></div>
  </section>
</main>
<footer class="foot">
  <nav class="parts" id="parts" aria-label="Parts"></nav>
  <div class="fnav"><button id="prevP" aria-label="Previous part">&#8592;</button><button id="nextP" aria-label="Next part">&#8594;</button></div>
  <button class="footbtn" id="finishBtn" aria-label="Finish and submit">&#10003;</button>
</footer>
<div id="overlay"></div>

}
function mailInfo() {
  const full = composeText(), subject = "IELTS Writing - " + st.name + " - " + set.title;
  let body = full, inline = true;
  if (encodeURIComponent(full).length > 1800) { inline = false; body = full.split("=== PART 1 ===")[0] + "(Your writing has been copied to your clipboard. Paste it here with Ctrl+V, or Cmd+V on a Mac.)"; }
  return { full, inline, subject, href: "mailto:" + TEACHER + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body) };
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); return true; } catch (e) { const a = document.createElement("textarea"); a.value = t; a.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} a.remove(); return ok; } }
function download() { const m = mailInfo(); const b = new Blob([m.full], { type: "text/plain;charset=utf-8" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "ielts-writing-" + st.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + set.id + ".txt"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function sentModal() {
  const notSet = /HERE/.test(TEACHER);
  overlay(`<h2>✓ Your writing is submitted</h2><p>Now send it to your teacher. Choose one way:</p><p><b>1. Email (best).</b> Your email app opens with your name and details. Your writing is copied automatically: if it does not appear in the email, paste it with <b>Ctrl+V</b> (<b>Cmd+V</b> on a Mac). Then press <b>Send</b>.</p><div class="row" style="margin-top:0"><button class="btn" id="mail"${notSet ? " disabled" : ""}>Open email →</button></div>${notSet ? `<p class="warn-note">The teacher's email address has not been set yet. Use option 2 or 3.</p>` : `<p style="margin-top:8px"><small>To: ${esc(TEACHER)}</small></p>`}<p id="mailnote" aria-live="polite"></p><p><b>2. Copy.</b> Copy your writing and paste it into any email, message or document.</p><div class="row" style="margin-top:0"><button class="btn ghost" id="copy">Copy my writing</button></div><p style="margin-top:12px"><b>3. Download.</b> Save a text file and attach it to an email.</p><div class="row" style="margin-top:0"><button class="btn ghost" id="dl">Download as a file</button></div><p style="margin-top:14px"><small>Your email app must be set up on this computer. If nothing opens, use option 2 or 3. On a shared computer, use your own email to send the file.</small></p><div class="row"><button class="btn ghost" id="close">Close</button><a class="btn ghost" href="tests.html">Back to Practice tests</a></div>`);
  $("close").onclick = closeOverlay;
  $("copy").onclick = async () => { const ok = await copyText(mailInfo().full); toast(ok ? "Copied. Now paste it into your email." : "Could not copy. Use Download instead."); };
  $("dl").onclick = download;
  if ($("mail")) $("mail").onclick = async () => { const m = mailInfo(); const ok = await copyText(m.full); window.__lastMail = m.href; $("mailnote").innerHTML = m.inline ? (ok ? "Your email app should open with your writing inside. A copy is also on your clipboard." : "Your email app should open with your writing inside.") : (ok ? "Your email app should open. <b>Paste your writing into the email with Ctrl+V (Cmd+V on a Mac)</b>: it is on your clipboard." : "Your email app should open, but your writing did not copy. Use Download, then attach the file."); window.location.href = m.href; };
}
/* ---------- divider ---------- */
(function () { const d = $("divider"), tp = $("taskPane"), sp = $("split"); let drag = false;
  const move = e => { if (!drag) return; const r = sp.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; const pct = Math.min(75, Math.max(25, x / r.width * 100)); tp.style.flex = "0 0 " + pct + "%"; };
  d.addEventListener("mousedown", () => { drag = true; document.body.style.userSelect = "none"; });
  document.addEventListener("mousemove", move); document.addEventListener("mouseup", () => { drag = false; document.body.style.userSelect = ""; });
  d.addEventListener("touchstart", () => { drag = true; }, { passive: true }); document.addEventListener("touchmove", move, { passive: true }); document.addEventListener("touchend", () => { drag = false; });
  d.onkeydown = e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { const cur = parseFloat(tp.style.flexBasis) || 50; const n = Math.min(75, Math.max(25, cur + (e.key === "ArrowRight" ? 5 : -5))); tp.style.flex = "0 0 " + n + "%"; } };
})();
/* ---------- route ---------- */
$("restart").onclick = () => { if (!set) return; if (confirm("Delete your writing and start this test again?")) { localStorage.removeItem(KEY(set.id)); location.reload(); } };
window.addEventListener("hashchange", () => location.reload());
window.addEventListener("pagehide", save); document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
setInterval(() => { if (st && !st.submitted) save(); }, 10000);
(function () { const id = location.hash.replace("#", ""); set = SETS.find(s => s.id === id) || null;
  if (!set) { $("timer").textContent = "60:00"; chooser(); return; }
  st = load(set.id);
  if (st && st.started) init(); else { $("testName").textContent = set.title; startScreen(); }
})();
</script>
